<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chef-sito | Asistente de Cocina</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <div class="app-container">
    <!-- Encabezado de la App -->
    <header class="chef-header">
      <div class="avatar-container">
        <img id="chef-avatar" src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" alt="Chef-sito Avatar">
      </div>
      <h1>Chef-sito 🤖👨‍🍳</h1>
      <p id="chef-status">¡Tu asistente interactivo de cocina!</p>
    </header>

    <!-- Buscador y Selector de Recetas -->
    <section id="recipe-selector" class="card">
      <h2>¿Qué vamos a cocinar hoy?</h2>
      
      <input type="text" id="search-input" placeholder="🔍 Buscar receta por nombre..." onkeyup="filterRecipes()">
      
      <select id="recipe-dropdown">
        <option value="">-- Elige una receta --</option>
      </select>
      
      <button id="start-btn" onclick="startCooking()">¡Empezar a cocinar!</button>
      
      <hr style="margin: 20px 0; border: 0; border-top: 1px solid #e2e8f0;">
      
      <!-- Sección para Escanear / Subir Fotos de Recetas -->
      <h3>📸 Escanear receta nueva</h3>
      <p style="font-size: 13px; color: #666; margin-top: 5px;">Sube una foto de una receta y Chef-sito la aprenderá:</p>

      <input type="file" id="recipe-file-input" accept="image/*" capture="environment" style="margin-top: 10px;">
      <button onclick="processUploadedRecipe()" style="background-color: #4A5568; margin-top: 10px;">🤖 Analizar Foto con Chef-sito</button>
      <p id="upload-status" style="font-size: 14px; margin-top: 10px; font-weight: bold; color: #4A5568;"></p>
    </section>

    <!-- Panel de Pasos Guiados -->
    <section id="cooking-panel" class="card hidden">
      <h2 id="recipe-title">Receta</h2>
      <div class="step-box">
        <span id="step-number">Paso 1</span>
        <p id="step-instruction">Instrucción...</p>
      </div>

      <div class="controls">
        <button onclick="prevStep()">⬅️ Anterior</button>
        <button onclick="nextStep()">Siguiente ➡️</button>
      </div>
      
      <button class="reset-btn" onclick="resetCooking()">Elegir otra receta</button>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
